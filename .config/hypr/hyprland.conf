$mod = SUPER
$term = wezterm
$menu = rofi -show combi

monitor = eDP-1, 1280x720@60, 0x0, 1
monitor = , preferred, auto, 1

exec-once = dbus-update-activation-environment --systemd --all
exec-once = mako
exec-once = waybar
exec-once = flatpak run com.discordapp.Discord
exec-once = flatpak run org.telegram.desktop

input {
  kb_layout = us
  touchpad {
    tap-to-click = true
  }
}

general {
  border_size = 2
  gaps_in = 0
  gaps_out = 0
  layout = monocle
}

dwindle {
  force_split = 2
}

binds {
  movefocus_cycles_groupfirst = true
}

animations {
  enabled = false
}

cursor {
  no_warps = true
}

windowrule = match:class ^(vivaldi-stable)$, workspace 1 silent
windowrule = match:class ^(Todoist)$, workspace 4 silent
windowrule = match:class ^(org.telegram.desktop)$, workspace name:messages silent
windowrule = match:class ^(discord)$, workspace name:messages silent

# Basics
bind = $mod, Return, exec, $term
bind = $mod SHIFT, S, exec, screenshot
bind = $mod SHIFT, Q, killactive
bind = $mod, D, exec, $menu
bind = $mod, G, exec, vivaldi-stable
bind = $mod SHIFT, C, exec, hyprctl reload
bind = $mod SHIFT, E, exec, swaynag -t warning -m 'Exit Hyprland?' -B 'Yes' 'hyprctl dispatch exit'
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bind = $mod, W, exec, hyprctl keyword workspace "name:$(hyprctl activeworkspace -j | jq -r .name), layout:monocle"
bind = $mod, E, exec, hyprctl keyword workspace "name:$(hyprctl activeworkspace -j | jq -r .name), layout:dwindle"

# Focus
bind = $mod, H, exec, ~/.config/hypr/focus.sh l
bind = $mod, J, exec, ~/.config/hypr/focus.sh d
bind = $mod, K, exec, ~/.config/hypr/focus.sh u
bind = $mod, L, exec, ~/.config/hypr/focus.sh r
bind = $mod, Left, exec, ~/.config/hypr/focus.sh l
bind = $mod, Down, exec, ~/.config/hypr/focus.sh d
bind = $mod, Up, exec, ~/.config/hypr/focus.sh u
bind = $mod, Right, exec, ~/.config/hypr/focus.sh r

# Move
bind = $mod SHIFT, H, movewindoworgroup, l
bind = $mod SHIFT, J, movewindoworgroup, d
bind = $mod SHIFT, K, movewindoworgroup, u
bind = $mod SHIFT, L, movewindoworgroup, r
bind = $mod SHIFT, Left, movewindoworgroup, l
bind = $mod SHIFT, Down, movewindoworgroup, d
bind = $mod SHIFT, Up, movewindoworgroup, u
bind = $mod SHIFT, Right, movewindoworgroup, r

# Workspaces (xmonad-style: pull workspace to the focused monitor)
bind = $mod, 1, focusworkspaceoncurrentmonitor, 1
bind = $mod, 2, focusworkspaceoncurrentmonitor, 2
bind = $mod, 3, focusworkspaceoncurrentmonitor, 3
bind = $mod, 4, focusworkspaceoncurrentmonitor, 4
bind = $mod, 5, focusworkspaceoncurrentmonitor, 5
bind = $mod, 6, focusworkspaceoncurrentmonitor, 6
bind = $mod, 7, focusworkspaceoncurrentmonitor, 7
bind = $mod, 8, focusworkspaceoncurrentmonitor, 8
bind = $mod, 9, focusworkspaceoncurrentmonitor, 9
bind = $mod, 0, focusworkspaceoncurrentmonitor, 10
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod SHIFT, 0, movetoworkspacesilent, 10
bind = $mod, T, focusworkspaceoncurrentmonitor, name:messages
bind = $mod SHIFT, T, movetoworkspacesilent, name:messages

# Layout
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, Space, togglefloating

# Scratchpad
bind = $mod SHIFT, Minus, movetoworkspacesilent, special
bind = $mod, Minus, togglespecialworkspace

# Resize
bind = $mod, R, submap, resize
submap = resize
binde = , H, resizeactive, -10 0
binde = , J, resizeactive, 0 10
binde = , K, resizeactive, 0 -10
binde = , L, resizeactive, 10 0
binde = , Left, resizeactive, -10 0
binde = , Down, resizeactive, 0 10
binde = , Up, resizeactive, 0 -10
binde = , Right, resizeactive, 10 0
bind = , Return, submap, reset
bind = , Escape, submap, reset
submap = reset

# Media keys
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bindel = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bindel = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bindl = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind = , Print, exec, grim
